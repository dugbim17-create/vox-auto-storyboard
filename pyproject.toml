[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-storyboard-vox"
version = "0.7.0"
description = "Auto storyboard -> image -> VoxStyle motion -> voice -> final video (local Windows MVP)"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
    "Pillow>=10.2",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pytest-mock>=3.12",
]

[project.scripts]
auto-storyboard = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that reach live local services (CLIProxy, OmniVoice)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = [".git", "projects", "data", "config/discovered"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501", # line length handled by formatter / project style
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/projects/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
